name: Validate Streamlit app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Static tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import dependency smoke check
        run: python -c "import streamlit, pandas, openpyxl, xlrd, qrcode, reportlab; print('dependencies ok')"
